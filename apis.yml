name: Tara Ai
description: Tara AI (Y Combinator W15, originally Gradberry) was a San Jose-based engineering
  efficiency platform that used fine-tuned LLMs over source control and project data to measure
  cycle times, benchmarks, and delivery velocity, integrating with GitHub, GitLab, Jira, and
  Slack. Backed by Aspect Ventures, Y Combinator, and Slack Fund (~$13M raised). As of July 2026
  the company is listed as permanently closed on Crunchbase and tara.ai is a parked domain; no
  public API, developer docs, or SDKs were ever published, and the TARAAI GitHub org has no
  public repositories.
